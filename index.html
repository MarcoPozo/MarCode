<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Aplica el tema guardado antes del primer paint, para no mostrar un
      // flash del tema oscuro por defecto cuando el usuario eligió claro.
      (function () {
        try {
          var stored = localStorage.getItem("marcode-theme");
          if (stored === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {
          // localStorage inaccesible (modo privado, etc.) — se queda en el
          // tema oscuro por defecto del atributo estático de arriba.
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />

    <title>Marco Pozo - Portafolio</title>
    <meta
      name="description"
      content="Portafolio de Marco Pozo, Full Stack Developer especializado en frontend. Proyectos, stack tecnológico y contacto para trabajar juntos."
    />
    <link rel="canonical" href="https://marcopozo.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MarCode" />
    <meta property="og:title" content="Marco Pozo - Portafolio" />
    <meta
      property="og:description"
      content="Portafolio de Marco Pozo, Full Stack Developer especializado en frontend. Proyectos, stack tecnológico y contacto para trabajar juntos."
    />
    <meta property="og:url" content="https://marcopozo.dev/" />
    <meta property="og:image" content="https://marcopozo.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->

      name="twitter:description"
